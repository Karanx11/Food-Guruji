name: food_guruji
description: "Food Guruji: photo-based nutrition tracking."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/foods/common_foods.json
